{% extends "base.html" %}

{% block posthead %} 
  {% for post in section.pages %}
    <link rel="prerender" href="{{ post.permalink }}" />
  {% endfor %}
{% endblock posthead %}

{% block content %}

  <h2>Blog posts</h2>

  {{ section.content | safe }}

  {% for post in section.pages %}
    {{<post_preview post={post} />}}
  {% endfor %}
{% endblock content %}

{% extends "base.html" %}

{% block posthead %} 
  {% for post in term.pages %}
    <link rel="prerender" href="{{ post.permalink }}" />
  {% endfor %}
{% endblock posthead %}

{% block content %}
  <h1>{{ term.pages | length }} pages tagged with "{{ term.name }}"</h1>
  <div class="taxonomy-container">
    {% for post in term.pages %}
      {{<post_preview post={post} />}}
    {% endfor %}
  </div>
{% endblock content %}
